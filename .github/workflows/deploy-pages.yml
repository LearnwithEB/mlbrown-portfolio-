# Publishes the site to GitHub Pages.
# Pages serves the `gh-pages` branch; this workflow keeps that branch in
# sync with the default branch on every push, so editing any file on the
# default branch automatically updates the live site.
name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/ml-brown-portfolio-site-byd19e]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish to gh-pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git push origin HEAD:gh-pages --force
